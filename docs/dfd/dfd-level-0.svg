<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <style>text{font-family:Arial,sans-serif;fill:#172554}.title{font-size:30px;font-weight:bold}.label{font-size:19px;font-weight:bold}.small{font-size:15px}.entity{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.process{fill:#f5f3ff;stroke:#7c3aed;stroke-width:3}.store{fill:#ecfdf5;stroke:#059669;stroke-width:2}.flow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
